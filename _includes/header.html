<header class="site-header">
    <div class="wrapper" style="background-image: url({{ '/assets/images/oregon_bridge.jpg' | relative_url }});
                                background-position: center bottom;">
        <button class="menu-icon" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false">
            <svg viewBox="0 0 18 15" aria-hidden="true">
                <rect y="0" width="18" height="3" rx="1.5"/>
                <rect y="6" width="18" height="3" rx="1.5"/>
                <rect y="12" width="18" height="3" rx="1.5"/>
            </svg>
        </button>
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a> <br>
        <nav class="site-nav" id="site-nav">
            <div class="trigger">
              {% for item in site.data.navigation %}
              <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {% endfor %}
            </div>
        </nav>
    </div>
</header>
