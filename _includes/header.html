<header class="site-header">
    <div class="wrapper" style="background-image: url({{ '/assets/images/oregon_bridge.jpg' | relative_url }});
                                background-position: center bottom;">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a> <br>
        <nav class="site-nav">
            <div class="trigger">
              {% for item in site.data.navigation %}
              <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {% endfor %}
            </div>
        </nav>
    </div>
</header>
