title: Cowjumping - Daniel Harbeck's Page
name: Daniel Harbeck
email: drharbeck@gmail.com
github: drhaz

markdown: kramdown

permalink: pretty

sass:
    style: compressed

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jemoji


defaults:
    - {scope: {type: posts}, values: {layout: post, permalink: '/:year/:title'}}
    - {scope: {type: myactivities}, values: {layout: page}}
    - {scope: {type: photography}, values: {layout: page, lightbox: true, comments: true}}

include:
  - _pages

exclude:
  - CNAME
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - serve
  - new-post
  - vendor


collections:
  myactivities:
    output: true
    permalink: /myactivities/:path/
  photography:
    output: true
    permalink: /photography/:path/
